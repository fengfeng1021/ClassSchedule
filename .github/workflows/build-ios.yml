name: Build and Package iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build with xcodebuild
        run: |
          cd ClassSchedule.swiftpm
          xcodebuild -scheme ClassSchedule -destination 'generic/platform=iOS' -derivedDataPath ./build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          cd ClassSchedule.swiftpm
          mkdir -p Payload
          cp -r build/Build/Products/*-iphoneos/*.app Payload/
          APP_PATH=$(ls -d Payload/*.app)
          echo "Configuring Info.plist in $APP_PATH"

          # 啟用 120Hz ProMotion 超高更新率與原生全螢幕渲染
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$APP_PATH/Info.plist" || /usr/libexec/PlistBuddy -c "Set :CADisableMinimumFrameDurationOnPhone true" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDuration bool true" "$APP_PATH/Info.plist" || /usr/libexec/PlistBuddy -c "Set :CADisableMinimumFrameDuration true" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool false" "$APP_PATH/Info.plist" || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen false" "$APP_PATH/Info.plist"

          echo "--- Info.plist verification ---"
          plutil -p "$APP_PATH/Info.plist" | grep -E "CADisable|UILaunch" || true

          echo "=== Building Native WidgetKit Extension ==="
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          WIDGET_APPEX_DIR="$APP_PATH/PlugIns/ClassScheduleWidget.appex"
          mkdir -p "$WIDGET_APPEX_DIR"

          echo "Compiling ClassScheduleWidget with swiftc..."
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            -emit-executable \
            -Xlinker -rpath -Xlinker /System/Library/Frameworks \
            -Xlinker -rpath -Xlinker @executable_path/Frameworks \
            -Xlinker -rpath -Xlinker @executable_path/../../Frameworks \
            -o "$WIDGET_APPEX_DIR/ClassScheduleWidget" \
            WidgetExtension/*.swift \
            Sources/AppModule/Models/Course.swift \
            Sources/AppModule/Models/Period.swift \
            Sources/AppModule/Models/TimeOfDay.swift \
            Sources/AppModule/Models/WidgetSettings.swift \
            Sources/AppModule/Models/ScheduleSettings.swift \
            Sources/AppModule/Models/ScheduleCalculator.swift \
            -framework WidgetKit \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation

          echo "Copying Widget Extension Info.plist and Assets..."
          cp WidgetExtension/Info.plist "$WIDGET_APPEX_DIR/Info.plist"
          cp -f "$APP_PATH"/AppIcon* "$WIDGET_APPEX_DIR/" 2>/dev/null || true
          cp -f "$APP_PATH"/Assets.car "$WIDGET_APPEX_DIR/" 2>/dev/null || true
          chmod +x "$WIDGET_APPEX_DIR/ClassScheduleWidget"

          echo "Ad-hoc signing Widget and App for sideloading tools..."
          codesign -s - --force "$WIDGET_APPEX_DIR" || true
          codesign -s - --force "$APP_PATH" || true

          echo "=== WidgetKit Extension Verification ==="
          ls -lh "$WIDGET_APPEX_DIR"
          file "$WIDGET_APPEX_DIR/ClassScheduleWidget"
          plutil -p "$WIDGET_APPEX_DIR/Info.plist"

          zip -qr ClassSchedule.ipa Payload
          ls -lh ClassSchedule.ipa


      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassSchedule-iOS-IPA
          path: ClassSchedule.swiftpm/ClassSchedule.ipa
          retention-days: 30

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep 'displayVersion:' ClassSchedule.swiftpm/Package.swift | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VERSION}"
          echo "Releasing $TAG..."
          gh release create "$TAG" ClassSchedule.swiftpm/ClassSchedule.ipa \
            --title "ClassSchedule iOS App ($TAG)" \
            --notes "課表 iOS 原生應用程式安裝包 (IPA)。全面支援 iOS 桌面 WidgetKit 小工具（小型、中型、大型、鎖定畫面，精確到分動態更新進度條與三種顯示模式）、開啟 App 自動檢測更新、120Hz ProMotion 超高刷新率、Apple 原生液態毛玻璃質感，以及手機直向/平板橫向高清課表圖片匯出。" || \
          gh release upload "$TAG" ClassSchedule.swiftpm/ClassSchedule.ipa --clobber


