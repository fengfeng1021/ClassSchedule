name: Build and Verify iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build with xcodebuild
        run: |
          cd ClassSchedule.swiftpm
          xcodebuild -scheme ClassSchedule -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
